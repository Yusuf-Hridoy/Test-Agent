name: local-shop
base_url: "http://127.0.0.1:8099"
auth:
  strategy: manual
scope:
  include: ["127.0.0.1:8099/**"]
forbidden_elements: ["logout", "delete", "billing", "payment"]
budget:
  max_steps: 60
  max_llm_requests: 40
  max_minutes: 20
model:
  min_delay_ms: 7000
run:
  headed: false
  slow_network_grace_ms: 15000
